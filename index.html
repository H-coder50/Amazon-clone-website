<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amazon</title>
    <!--connect cdn font-awesome link here for using icons-->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css" integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg==" crossorigin="anonymous" referrerpolicy="no-referrer">
    <link rel="stylesheet" href="style.css">
</head>
    
<body>
    <header>
        <!--create navbar-->
        <div class="navbar"> 
            <!--1-create navbar-logo(with border when hover)-->       
            <div class="nav-logo border">  
                <div class="logo"></div>   
            </div>
            <!--2.create navbar address(with border when hover)-->    
            <div class="nav-address border">
                <p class="add1">Deliver to</p>
                <div class="add-icon">      <!--add location icon-->
                    <i class="fa-solid fa-location-dot"></i>  <!--link from fontawsome web-->
                    <p class="add2">Pakistan</p>
                </div>
             </div>
            <!--3-create nav-search bar-->
            <div class="nav-search">
                <select>
                    <option>All</option>
                </select class="search-select">
                <input placeholder="Search Amazon" class="search-input">
                    <div class="search-icon">
                        <i class="fa-solid fa-magnifying-glass"></i> <!--link search icon-->
                    </div>
            </div>
        </div>
    </header>
</body>
</html>
